<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Talk to Rumi & Kira!</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap');

  :root {
    --rumi-pink:   #ff6eb4;
    --rumi-light:  #ffe0f0;
    --kira-purple: #8b5cf6;
    --kira-light:  #ede9fe;
    --bg:          #1a1030;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
    position: relative;
  }

  /* Starfield background */
  .stars {
    position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0;
  }
  .star {
    position: absolute; border-radius: 50%; background: white;
    animation: twinkle var(--d, 3s) ease-in-out infinite;
  }
  @keyframes twinkle {
    0%,100% { opacity: 0.2; transform: scale(1); }
    50%      { opacity: 1;   transform: scale(1.4); }
  }

  .app {
    position: relative; z-index: 1;
    width: 100%; max-width: 480px;
    min-height: 100dvh;
    display: flex; flex-direction: column;
    align-items: center;
    padding: 20px 16px 32px;
    gap: 16px;
  }

  h1 {
    font-size: 1.6rem; font-weight: 900;
    color: white; text-align: center;
    text-shadow: 0 2px 20px rgba(139,92,246,.6);
    letter-spacing: -0.02em;
  }
  h1 span { color: var(--rumi-pink); }

  /* Robot selector tabs */
  .tabs {
    display: flex; gap: 10px; width: 100%;
  }
  .tab {
    flex: 1; padding: 10px 8px; border-radius: 16px; border: 3px solid transparent;
    cursor: pointer; text-align: center; font-family: inherit;
    font-weight: 800; font-size: 1rem; transition: all .2s;
    background: rgba(255,255,255,.07);
    color: rgba(255,255,255,.5);
  }
  .tab.rumi.active   { background: var(--rumi-light); color: #c2185b; border-color: var(--rumi-pink); }
  .tab.kira.active   { background: var(--kira-light); color: #5b21b6; border-color: var(--kira-purple); }
  .tab.both.active   { background: linear-gradient(135deg,var(--rumi-light),var(--kira-light)); color: #444; border-color: #aaa; }

  /* Robot face display */
  .face-area {
    width: 200px; height: 200px;
    border-radius: 32px; overflow: hidden;
    position: relative;
    box-shadow: 0 8px 40px rgba(0,0,0,.5);
    transition: transform .2s;
  }
  .face-area.speaking { animation: robotBounce .4s ease-in-out infinite alternate; }
  @keyframes robotBounce { from { transform: translateY(0); } to { transform: translateY(-6px); } }

  .face-svg { width: 100%; height: 100%; }

  /* Chat bubbles */
  .chat {
    width: 100%; flex: 1; overflow-y: auto;
    display: flex; flex-direction: column; gap: 10px;
    padding: 4px 0;
    max-height: 240px;
  }
  .bubble {
    max-width: 85%; padding: 12px 16px; border-radius: 20px;
    font-size: 1rem; font-weight: 700; line-height: 1.4;
    animation: popIn .2s ease-out;
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(.8) translateY(10px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }
  .bubble.user   { align-self: flex-end; background: #3b82f6; color: white; border-bottom-right-radius: 6px; }
  .bubble.rumi   { align-self: flex-start; background: var(--rumi-light); color: #c2185b; border-bottom-left-radius: 6px; }
  .bubble.kira   { align-self: flex-start; background: var(--kira-light); color: #5b21b6; border-bottom-left-radius: 6px; }
  .bubble.system { align-self: center; background: rgba(255,255,255,.1); color: rgba(255,255,255,.6); font-size: .85rem; font-weight: 600; padding: 6px 14px; }

  /* Big talk button */
  .btn-wrap {
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    width: 100%;
  }

  .talk-btn {
    width: 140px; height: 140px; border-radius: 50%;
    border: none; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px; font-family: inherit; font-weight: 900; font-size: 1.1rem;
    transition: transform .1s, box-shadow .1s;
    position: relative; overflow: hidden;
    user-select: none; -webkit-user-select: none;
    touch-action: none;
  }

  .talk-btn.rumi-btn {
    background: radial-gradient(circle at 40% 35%, #ff9dd3, var(--rumi-pink));
    color: white;
    box-shadow: 0 6px 30px rgba(255,110,180,.5), 0 2px 8px rgba(0,0,0,.3);
  }
  .talk-btn.kira-btn {
    background: radial-gradient(circle at 40% 35%, #c4b5fd, var(--kira-purple));
    color: white;
    box-shadow: 0 6px 30px rgba(139,92,246,.5), 0 2px 8px rgba(0,0,0,.3);
  }
  .talk-btn.both-btn {
    background: radial-gradient(circle at 40% 35%, #f9a8d4, #818cf8);
    color: white;
    box-shadow: 0 6px 30px rgba(180,120,220,.5), 0 2px 8px rgba(0,0,0,.3);
  }

  .talk-btn:active, .talk-btn.recording {
    transform: scale(.93);
    box-shadow: 0 2px 10px rgba(0,0,0,.4) !important;
  }

  .talk-btn .mic-icon { font-size: 2.8rem; }
  .talk-btn .btn-label { font-size: .95rem; font-weight: 900; letter-spacing: .03em; }

  /* Recording pulse ring */
  .pulse-ring {
    position: absolute; inset: -8px; border-radius: 50%;
    border: 4px solid rgba(255,255,255,.6);
    animation: none;
    pointer-events: none;
  }
  .recording .pulse-ring {
    animation: pulsering 1s ease-out infinite;
  }
  @keyframes pulsering {
    0%   { transform: scale(1);    opacity: .8; }
    100% { transform: scale(1.35); opacity: 0; }
  }

  .status {
    font-size: .9rem; font-weight: 700;
    color: rgba(255,255,255,.6); text-align: center;
    min-height: 22px;
  }
  .status.recording { color: #ff6eb4; }
  .status.thinking  { color: #c4b5fd; }
  .status.speaking  { color: #86efac; }

  /* Thinking dots */
  .dots span {
    display: inline-block; animation: dotbounce 1.2s ease-in-out infinite;
    font-size: 1.4rem;
  }
  .dots span:nth-child(2) { animation-delay: .2s; }
  .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes dotbounce {
    0%,80%,100% { transform: translateY(0); }
    40%         { transform: translateY(-8px); }
  }
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="app">
  <h1>Talk to <span>Rumi</span> & Kira! 🤖</h1>

  <!-- Robot selector -->
  <div class="tabs">
    <button class="tab rumi active" onclick="selectRobot('rumi')">🩷 Rumi</button>
    <button class="tab both"       onclick="selectRobot('both')">🤖🤖 Both</button>
    <button class="tab kira"       onclick="selectRobot('kira')">💜 Kira</button>
  </div>

  <!-- Face display -->
  <div class="face-area" id="faceArea">
    <svg class="face-svg" id="faceSvg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <!-- Rumi face — pink -->
      <rect width="200" height="200" fill="#ffe0f0"/>
      <!-- Hair dome -->
      <ellipse cx="100" cy="18" rx="70" ry="36" fill="#7c3aed"/>
      <!-- Face plate -->
      <rect x="20" y="28" width="160" height="152" rx="24" fill="#ffe0f0"/>
      <rect x="22" y="30" width="156" height="148" rx="22" fill="none" stroke="#ff6eb4" stroke-width="3"/>
      <!-- Eyes -->
      <circle cx="70" cy="95" r="22" fill="white"/>
      <circle cx="70" cy="95" r="13" fill="#00bfa5"/>
      <circle cx="70" cy="95" r="6"  fill="#1a1030"/>
      <circle cx="63" cy="88" r="5"  fill="white"/>
      <circle cx="130" cy="95" r="22" fill="white"/>
      <circle cx="130" cy="95" r="13" fill="#00bfa5"/>
      <circle cx="130" cy="95" r="6"  fill="#1a1030"/>
      <circle cx="123" cy="88" r="5"  fill="white"/>
      <!-- Blush -->
      <ellipse cx="48"  cy="115" rx="16" ry="8" fill="#ffb3d1" opacity=".7"/>
      <ellipse cx="152" cy="115" rx="16" ry="8" fill="#ffb3d1" opacity=".7"/>
      <!-- Nose -->
      <circle cx="95"  cy="118" r="3" fill="#e8a0b0"/>
      <circle cx="105" cy="118" r="3" fill="#e8a0b0"/>
      <!-- Mouth (smile) -->
      <path d="M82 138 Q100 152 118 138" stroke="#e05080" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <!-- Bow -->
      <polygon points="30,44 44,56 30,66" fill="#ff6eb4"/>
      <polygon points="58,44 44,56 58,66" fill="#ff6eb4"/>
      <circle cx="44" cy="56" r="6" fill="#ff9dd3"/>
    </svg>
  </div>

  <!-- Chat log -->
  <div class="chat" id="chatLog">
    <div class="bubble system">👋 Hold the button to talk!</div>
  </div>

  <!-- Status -->
  <div class="status" id="status">Ready!</div>

  <!-- Talk button -->
  <div class="btn-wrap">
    <button class="talk-btn rumi-btn" id="talkBtn"
      ontouchstart="startRecording(event)" ontouchend="stopRecording(event)"
      onmousedown="startRecording(event)"  onmouseup="stopRecording(event)"
      onmouseleave="stopRecording(event)">
      <div class="pulse-ring"></div>
      <span class="mic-icon">🎤</span>
      <span class="btn-label">HOLD TO TALK</span>
    </button>
  </div>
</div>

<script>
// ── Config — change this to your Cerebro IP ──────────────────
const CEREBRO = 'http://YOUR_CEREBRO_IP:5005';
const ROBOT_IDS = { rumi: 'robot2', kira: 'robot1' };
const KID_NAME  = 'YOUR_SONS_NAME';

// ── State ─────────────────────────────────────────────────────
let currentRobot = 'rumi';
let mediaRec = null, audioChunks = [], isRecording = false;
let audioCtx = null;

// ── Stars ─────────────────────────────────────────────────────
(function createStars() {
  const container = document.getElementById('stars');
  for (let i = 0; i < 60; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 3 + 1;
    s.style.cssText = `
      width:${size}px; height:${size}px;
      left:${Math.random()*100}%; top:${Math.random()*100}%;
      --d:${(Math.random()*3+2).toFixed(1)}s;
      animation-delay:${(Math.random()*3).toFixed(1)}s;
    `;
    container.appendChild(s);
  }
})();

// ── Robot faces ───────────────────────────────────────────────
const FACES = {
  rumi: `
    <rect width="200" height="200" fill="#ffe0f0"/>
    <ellipse cx="100" cy="18" rx="70" ry="36" fill="#7c3aed"/>
    <rect x="20" y="28" width="160" height="152" rx="24" fill="#ffe0f0"/>
    <rect x="22" y="30" width="156" height="148" rx="22" fill="none" stroke="#ff6eb4" stroke-width="3"/>
    <circle cx="70"  cy="95" r="22" fill="white"/>
    <circle cx="70"  cy="95" r="13" fill="#00bfa5"/>
    <circle cx="70"  cy="95" r="6"  fill="#1a1030"/>
    <circle cx="63"  cy="88" r="5"  fill="white"/>
    <circle cx="130" cy="95" r="22" fill="white"/>
    <circle cx="130" cy="95" r="13" fill="#00bfa5"/>
    <circle cx="130" cy="95" r="6"  fill="#1a1030"/>
    <circle cx="123" cy="88" r="5"  fill="white"/>
    <ellipse cx="48"  cy="115" rx="16" ry="8" fill="#ffb3d1" opacity=".7"/>
    <ellipse cx="152" cy="115" rx="16" ry="8" fill="#ffb3d1" opacity=".7"/>
    <circle cx="95"  cy="118" r="3" fill="#e8a0b0"/>
    <circle cx="105" cy="118" r="3" fill="#e8a0b0"/>
    <path d="M82 138 Q100 152 118 138" stroke="#e05080" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <polygon points="30,44 44,56 30,66" fill="#ff6eb4"/>
    <polygon points="58,44 44,56 58,66" fill="#ff6eb4"/>
    <circle cx="44" cy="56" r="6" fill="#ff9dd3"/>
  `,
  kira: `
    <rect width="200" height="200" fill="#ede9fe"/>
    <ellipse cx="100" cy="15" rx="72" ry="38" fill="#5b21b6"/>
    <ellipse cx="80"  cy="12" rx="20" ry="30" fill="#7c3aed"/>
    <rect x="100" y="-8" width="8" height="28" rx="4" fill="#5b21b6"/>
    <circle cx="104" cy="-10" r="7" fill="#00e5ff"/>
    <circle cx="104" cy="-10" r="4" fill="#e0f7fa"/>
    <rect x="20" y="28" width="160" height="152" rx="24" fill="#ede9fe"/>
    <rect x="22" y="30" width="156" height="148" rx="22" fill="none" stroke="#8b5cf6" stroke-width="3"/>
    <circle cx="70"  cy="95" r="22" fill="white"/>
    <circle cx="70"  cy="95" r="13" fill="#7c3aed"/>
    <circle cx="70"  cy="95" r="6"  fill="#1a1030"/>
    <circle cx="63"  cy="88" r="5"  fill="white"/>
    <circle cx="130" cy="95" r="22" fill="white"/>
    <circle cx="130" cy="95" r="13" fill="#7c3aed"/>
    <circle cx="130" cy="95" r="6"  fill="#1a1030"/>
    <circle cx="123" cy="88" r="5"  fill="white"/>
    <ellipse cx="48"  cy="115" rx="16" ry="8" fill="#fca5a5" opacity=".7"/>
    <ellipse cx="152" cy="115" rx="16" ry="8" fill="#fca5a5" opacity=".7"/>
    <circle cx="95"  cy="118" r="3" fill="#c4a0b0"/>
    <circle cx="105" cy="118" r="3" fill="#c4a0b0"/>
    <path d="M82 138 Q100 152 118 138" stroke="#7c3aed" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <rect x="148" y="38" width="20" height="10" rx="4" fill="#f97316"/>
    <circle cx="150" cy="43" r="4" fill="#fb923c"/>
  `,
  both: `
    <rect width="200" height="200" fill="#f5f0ff"/>
    <ellipse cx="65" cy="15" rx="45" ry="28" fill="#7c3aed"/>
    <ellipse cx="135" cy="15" rx="45" ry="28" fill="#7c3aed"/>
    <rect x="10"  y="28" width="80" height="152" rx="20" fill="#ffe0f0"/>
    <rect x="110" y="28" width="80" height="152" rx="20" fill="#ede9fe"/>
    <rect x="10"  y="30" width="80" height="148" rx="18" fill="none" stroke="#ff6eb4" stroke-width="2.5"/>
    <rect x="110" y="30" width="80" height="148" rx="18" fill="none" stroke="#8b5cf6" stroke-width="2.5"/>
    <circle cx="38" cy="98" r="14" fill="white"/>
    <circle cx="38" cy="98" r="8"  fill="#00bfa5"/>
    <circle cx="38" cy="98" r="4"  fill="#1a1030"/>
    <circle cx="34" cy="94" r="3"  fill="white"/>
    <circle cx="62" cy="98" r="14" fill="white"/>
    <circle cx="62" cy="98" r="8"  fill="#00bfa5"/>
    <circle cx="62" cy="98" r="4"  fill="#1a1030"/>
    <circle cx="58" cy="94" r="3"  fill="white"/>
    <path d="M30 128 Q50 138 70 128" stroke="#e05080" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="138" cy="98" r="14" fill="white"/>
    <circle cx="138" cy="98" r="8"  fill="#7c3aed"/>
    <circle cx="138" cy="98" r="4"  fill="#1a1030"/>
    <circle cx="134" cy="94" r="3"  fill="white"/>
    <circle cx="162" cy="98" r="14" fill="white"/>
    <circle cx="162" cy="98" r="8"  fill="#7c3aed"/>
    <circle cx="162" cy="98" r="4"  fill="#1a1030"/>
    <circle cx="158" cy="94" r="3"  fill="white"/>
    <path d="M130 128 Q150 138 170 128" stroke="#7c3aed" stroke-width="3" fill="none" stroke-linecap="round"/>
  `
};

function selectRobot(robot) {
  currentRobot = robot;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelector(`.tab.${robot}`).classList.add('active');
  document.getElementById('faceSvg').innerHTML = FACES[robot];
  const btn = document.getElementById('talkBtn');
  btn.className = `talk-btn ${robot === 'rumi' ? 'rumi-btn' : robot === 'kira' ? 'kira-btn' : 'both-btn'}`;
}

// ── Recording ─────────────────────────────────────────────────
async function startRecording(e) {
  e.preventDefault();
  if (isRecording) return;

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioChunks = [];
    mediaRec = new MediaRecorder(stream);
    mediaRec.ondataavailable = ev => { if (ev.data.size) audioChunks.push(ev.data); };
    mediaRec.start();
    isRecording = true;

    document.getElementById('talkBtn').classList.add('recording');
    setStatus('recording', '🔴 Listening...');
  } catch (err) {
    setStatus('', '❌ Mic not allowed — check browser permissions');
  }
}

async function stopRecording(e) {
  e?.preventDefault();
  if (!isRecording || !mediaRec) return;
  isRecording = false;
  document.getElementById('talkBtn').classList.remove('recording');

  mediaRec.stop();
  mediaRec.stream.getTracks().forEach(t => t.stop());

  setStatus('thinking', '');
  showThinking();

  mediaRec.onstop = async () => {
    const blob = new Blob(audioChunks, { type: mediaRec.mimeType || 'audio/webm' });
    await sendAudio(blob);
  };
}

// ── Send to Cerebro ───────────────────────────────────────────
async function sendAudio(blob) {
  const robots = currentRobot === 'both'
    ? ['robot2', 'robot1']
    : [ROBOT_IDS[currentRobot]];

  let gotResponse = false;

  for (const robotId of robots) {
    try {
      const arrayBuf = await blob.arrayBuffer();
      const pcm = await convertToPCM(arrayBuf);

      const res = await fetch(`${CEREBRO}/web_chat?robot_id=${robotId}&kid_name=${KID_NAME}`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/octet-stream',
          'X-Session': robotId,
          'X-Robot-ID': robotId,
          'X-Mode': robotId === 'robot2' ? 'kid' : 'adult',
          'X-Kid-Name': KID_NAME,
          'X-Sample-Rate': '16000',
        },
        body: pcm,
      });

      if (res.ok && res.status === 200) {
        gotResponse = true;
        const name = robotId === 'robot2' ? 'Rumi' : 'Kira';
        const replyText = res.headers.get('X-Reply-Text') || '...';

        addBubble(name.toLowerCase(), `${name}: ${replyText}`);
        setStatus('speaking', `💬 ${name} is talking...`);
        document.getElementById('faceArea').classList.add('speaking');

        const audioData = await res.arrayBuffer();
        await playPCM(audioData);

        document.getElementById('faceArea').classList.remove('speaking');
      }
    } catch (err) {
      console.error(err);
    }
  }

  if (!gotResponse) {
    addBubble('system', "Hmm, couldn't hear that — try again!");
  }
  setStatus('', 'Ready!');
}

// ── PCM conversion (browser → 16kHz mono PCM) ───────────────
async function convertToPCM(arrayBuf) {
  if (!audioCtx) audioCtx = new AudioContext({ sampleRate: 16000 });
  const decoded = await audioCtx.decodeAudioData(arrayBuf);
  const channel = decoded.getChannelData(0);
  const int16 = new Int16Array(channel.length);
  for (let i = 0; i < channel.length; i++) {
    int16[i] = Math.max(-32768, Math.min(32767, channel[i] * 32767));
  }
  return int16.buffer;
}

async function playPCM(arrayBuf) {
  if (!audioCtx) audioCtx = new AudioContext({ sampleRate: 16000 });
  const int16 = new Int16Array(arrayBuf);
  const float32 = new Float32Array(int16.length);
  for (let i = 0; i < int16.length; i++) float32[i] = int16[i] / 32768;
  const buf = audioCtx.createBuffer(1, float32.length, 16000);
  buf.getChannelData(0).set(float32);
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  src.connect(audioCtx.destination);
  return new Promise(res => { src.onended = res; src.start(); });
}

// ── UI helpers ────────────────────────────────────────────────
function addBubble(type, text) {
  const log = document.getElementById('chatLog');
  const thinking = log.querySelector('.thinking-bubble');
  if (thinking) thinking.remove();
  const div = document.createElement('div');
  div.className = `bubble ${type}`;
  div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

function showThinking() {
  const log = document.getElementById('chatLog');
  const div = document.createElement('div');
  div.className = 'bubble system thinking-bubble';
  div.innerHTML = '<span class="dots"><span>•</span><span>•</span><span>•</span></span>';
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

function setStatus(cls, text) {
  const el = document.getElementById('status');
  el.className = `status ${cls}`;
  el.textContent = text;
}

// Init
selectRobot('rumi');
</script>
</body>
</html>
